<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Bootstrap 6 Widgets</text>
        <text class="content" x="40" y="78">34 widgets &#8226; Dialog, Drawer, Menu, Combobox, Datepicker</text>
        <text class="content" x="40" y="98">Markup of Bootstrap 6.0.0-alpha.1</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">ESM Bundle via Foxy</text>
        <text class="content" x="630" y="78">npm packages through Composer &#8226; Local or jsDelivr CDN</text>
        <text class="content" x="630" y="98">type="module" loading &#8226; Optional window.bootstrap</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">ActiveForm Layouts</text>
        <text class="content" x="40" y="198">Default &#8226; Horizontal &#8226; Inline &#8226; Floating labels</text>
        <text class="content" x="40" y="218">Switches, check lists, ranges, data-bs-validate</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Native Overlays</text>
        <text class="content" x="630" y="198">Dialog and Drawer on &lt;dialog&gt; &#8226; Menu, Tooltip, Popover</text>
        <text class="content" x="630" y="218">Placements, toggle buttons, and client events</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">52 Languages</text>
        <text class="content" x="40" y="318">yii.bootstrap6 category &#8226; PHP message files &#8226; Auto-registered</text>
        <text class="content" x="40" y="338">Translated close, navigation, and status labels</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Quality Gates</text>
        <text class="content" x="630" y="318">PHPStan Level Max &#8226; 100% mutation score &#8226; ECS &#8226; Rector</text>
        <text class="content" x="630" y="338">PHPUnit 12.5 on PHP 8.3 to 8.5 &#8226; Yii 2.0 and 22</text>
